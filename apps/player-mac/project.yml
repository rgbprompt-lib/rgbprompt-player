name: RGBPromptPlayer
options:
  minimumXcodeGenVersion: '2.40.0'
  deploymentTarget:
    macOS: '14.2'
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '14.2'
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    # Ad-hoc for everyday builds. Developer ID signing + notarization is
    # tools/player/sign-notarize-mac.sh (entitlements: RGBPromptPlayer.entitlements).
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ''
    PROVISIONING_PROFILE_SPECIFIER: ''
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    CLANG_ENABLE_MODULES: YES
    LIBRARY_SEARCH_PATHS:
      - $(inherited)
      - $(SRCROOT)/../player-core/target/aarch64-apple-darwin/release
    OTHER_LDFLAGS:
      - $(inherited)
      - $(SRCROOT)/../player-core/target/aarch64-apple-darwin/release/librgbprompt_player.a
      - -lpthread
      - -lm
      - -framework Security
      - -framework CoreFoundation
      - -framework CoreGraphics
      - -framework CoreAudio
      - -framework AudioToolbox
      - -framework Carbon
      - -framework IOKit
      - -framework ServiceManagement
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: '-Osize'
      SWIFT_COMPILATION_MODE: wholemodule
      DEAD_CODE_STRIPPING: YES
      DEBUG_INFORMATION_FORMAT: dwarf
      STRIP_INSTALLED_PRODUCT: YES
      DEPLOYMENT_POSTPROCESSING: YES
targets:
  PlayerKit:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/PlayerKit
    settings:
      base:
        PRODUCT_NAME: PlayerKit
        PRODUCT_MODULE_NAME: PlayerKit
        PRODUCT_BUNDLE_IDENTIFIER: com.rgbprompt.playerkit
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        SWIFT_INCLUDE_PATHS:
          - $(inherited)
          - $(SRCROOT)/CoreBridge
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../player-core/include
  RGBPromptPlayer:
    type: application
    platform: macOS
    sources:
      - path: Sources/RGBPromptPlayer
      - path: Resources
    dependencies:
      - target: PlayerKit
    settings:
      base:
        PRODUCT_NAME: RGBPrompt Player
        PRODUCT_BUNDLE_IDENTIFIER: com.rgbprompt.player
        MARKETING_VERSION: 0.7.0
        CURRENT_PROJECT_VERSION: 11
        INFOPLIST_FILE: Sources/RGBPromptPlayer/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        RGBP_API_BASE: https://rgbprompt.com/api
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: NO
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_INCLUDE_PATHS:
          - $(inherited)
          - $(SRCROOT)/CoreBridge
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../player-core/include
  PlayerKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PlayerKitTests
      - path: Resources
    dependencies:
      - target: PlayerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rgbprompt.playerkit.tests
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Tests/PlayerKitTests-Info.plist
        TEST_HOST: ''
        BUNDLE_LOADER: ''
        ENABLE_TESTING_SEARCH_PATHS: YES
        SWIFT_INCLUDE_PATHS:
          - $(inherited)
          - $(SRCROOT)/CoreBridge
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../player-core/include
schemes:
  RGBPromptPlayer:
    build:
      targets:
        RGBPromptPlayer: all
    run:
      config: Debug
  PlayerKitTests:
    build:
      targets:
        PlayerKitTests: all
    test:
      config: Debug
      targets:
        - PlayerKitTests
